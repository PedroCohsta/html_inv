<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Inventário TI Glória 122</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; 
    --surface: #1c1c1e; 
    --surface2: #2c2c2e; 
    --border: #38383a;
    --text: #f5f5f7; 
    --muted: #8e8e93; 
    --accent: #30d158; 
    --danger: #ff453a;
    --font: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --nav-height: 70px;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg); color: var(--text); font-family: var(--font); 
    line-height: 1.5; min-height: 100vh; padding-bottom: calc(var(--nav-height) + 20px);
  }

  header {
    background: rgba(28, 28, 30, 0.9);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--muted); }
  .logo span { color: var(--accent); font-weight: 600; }
  .btn-sync { background: none; border: none; color: var(--accent); font-size: 20px; padding: 4px; cursor: pointer; }

  nav {
    position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
    background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--muted); font-family: var(--font);
    font-size: 12px; font-weight: 500; padding: 8px; cursor: pointer; transition: 0.2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 22px; margin-bottom: 4px; }

  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  .view-section { display: none; }
  .view-section.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
  
  input, select {
    width: 100%; padding: 14px 16px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px;
    color: #fff; font-size: 16px; outline: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%; padding: 16px; background: var(--accent); color: #000;
    border: none; border-radius: 12px; font-weight: 700; font-size: 16px;
    margin-top: 10px; cursor: pointer; transition: 0.2s;
  }
  .btn-primary:active { opacity: 0.7; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    width: 100%; padding: 12px; background: transparent; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 12px; font-weight: 500; font-size: 14px;
    margin-top: 8px; cursor: pointer;
  }

  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; scrollbar-width: none; }
  .chip {
    background: var(--surface2); color: var(--text); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); cursor: pointer;
  }
  .chip.active { background: rgba(48, 209, 88, 0.15); color: var(--accent); border-color: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .card-img {
    width: 100%; height: 180px; background: #000;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  .card-img img { width: 100%; height: 100%; object-fit: contain; }
  .card-img span { font-size: 64px; }

  .card-content { padding: 16px; }
  .card-title { font-weight: 600; font-size: 18px; margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; background: var(--surface2); color: var(--accent); font-size: 11px; font-weight: 600; margin-bottom: 12px; }
  
  .spec-badge { background: #1c1c1e; color: #8e8e93; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-family: var(--mono); border: 1px solid var(--border); margin-right: 4px; }

  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--mono); font-size: 12px; background: #000; padding: 12px; border-radius: 8px; }
  .data-lbl { color: var(--muted); font-size: 9px; margin-bottom: 2px; }
  .data-val { color: #fff; word-break: break-all; }

  .delete-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255, 69, 58, 0.2); color: var(--danger); border: none;
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
  }

  .overlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.8); z-index: 200; display: none;
    align-items: center; justify-content: center; backdrop-filter: blur(5px);
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--surface); width: 90%; max-width: 350px;
    border-radius: 20px; padding: 24px; text-align: center; border: 1px solid var(--border);
  }
  .loader { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">// INVENTÁRIO <span>TI GLÓRIA 122</span></div>
  <button type="button" class="btn-sync" id="btn-sync-header">↻</button>
</header>

<main>
  <!-- VIEW: REGISTO -->
  <div id="view-scan" class="view-section active">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px;">
      <div>
        <label>Série / Património</label>
        <input type="text" id="f-serial" placeholder="Digite o serial">
      </div>
      <div>
        <label>Qtd.</label>
        <input type="number" id="f-qtd" value="1" min="1">
      </div>
    </div>

    <div id="block-select-model">
      <label>Modelo Equipamento</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="f-modelo" style="flex: 1;">
          <option value="">A carregar modelos...</option>
        </select>
        <button type="button" id="btn-delete-model-trigger" style="display:none; background:none; border:none; font-size:20px;">🗑️</button>
      </div>
      <button type="button" id="btn-show-new-model" class="btn-secondary">+ Novo Modelo</button>
    </div>

    <!-- BLOCO: NOVO MODELO -->
    <div id="block-new-model" style="display:none; background: rgba(48, 209, 88, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(48, 209, 88, 0.2);">
      <div class="input-group">
        <label>Nome do Modelo</label>
        <input type="text" id="f-new-name" placeholder="Ex: HP Pro 400">
      </div>
      <div class="input-group">
        <label>Categoria</label>
        <select id="f-new-type">
          <option value="Computador">Computador</option>
          <option value="Notebook">Notebook</option>
          <option value="Monitor">Monitor</option>
          <option value="Access Point">Access Point</option>
          <option value="Impressora">Impressora</option>
          <option value="Toner">Toner</option>
          <option value="Outro">Outro...</option>
        </select>
      </div>
      <div class="input-group">
        <label>Ícone ou Link da Foto</label>
        <input type="text" id="f-icon" value="📦">
      </div>
      <button type="button" id="btn-cancel-new-model" class="btn-secondary">Cancelar</button>
    </div>

    <!-- DADOS ESPECÍFICOS -->
    <div style="margin-top:20px;">
      <div id="group-ip" style="display:none;" class="input-group">
        <label>Endereço IP</label>
        <input type="text" id="f-ip" placeholder="0.0.0.0">
      </div>
      <div class="input-group"><label>Hostname</label><input type="text" id="f-hostname" placeholder="Nome na Rede"></div>
      <div class="input-group"><label>Sala / Setor</label><input type="text" id="f-setor" placeholder="Ex: Sala 102"></div>
    </div>
    
    <button type="button" class="btn-primary" id="btn-save-equipment">GUARDAR EQUIPAMENTO</button>
  </div>

  <!-- VIEW: INVENTÁRIO -->
  <div id="view-inventory" class="view-section">
    <div class="filter-scroll" id="cat-chips"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="search-input" placeholder="Pesquisar...">
      <select id="filter-room"><option value="ALL">Todas as Salas</option></select>
    </div>
    <div id="asset-grid"></div>
  </div>
</main>

<nav>
  <button type="button" class="nav-btn active" id="nav-reg-btn">📷<span>Registar</span></button>
  <button type="button" class="nav-btn" id="nav-inv-btn">📋<span>Inventário</span></button>
</nav>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Confirmar</h3>
    <p id="modal-text" style="margin:15px 0; color:var(--muted); font-size:14px;">Deseja eliminar este item?</p>
    <div style="display:flex; gap:10px;">
      <button class="btn-primary" style="background:var(--surface2); color:#fff;" id="btn-modal-cancel">Não</button>
      <button class="btn-primary" style="background:var(--danger);" id="btn-modal-confirm">Sim, Eliminar</button>
    </div>
  </div>
</div>

<script>
/**
 * LÓGICA DE PROGRAMAÇÃO - VERSÃO STANDALONE (HOSPEDAGEM EXTERNA)
 */

const API_URL = "https://script.google.com/macros/s/AKfycbxc77s_7bU9OxsvS8Pb80u7wSxrO305EfuvIZa14Ox1b4IPCsTHkJQxwKs5_vSI9f0D/exec";

let DB = { modelos: [], ativos: [], cat: 'TODOS' };
let TO_DELETE = null;

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
  setupUI();
  loadData();
});

function setupUI() {
  document.getElementById('nav-reg-btn').onclick = () => switchTab('scan');
  document.getElementById('nav-inv-btn').onclick = () => switchTab('inventory');
  document.getElementById('btn-sync-header').onclick = loadData;
  document.getElementById('btn-show-new-model').onclick = () => toggleNewModel(true);
  document.getElementById('btn-cancel-new-model').onclick = () => toggleNewModel(false);
  
  document.getElementById('f-new-type').onchange = updateUIFields;
  document.getElementById('f-modelo').onchange = updateUIFields;
  
  document.getElementById('btn-save-equipment').onclick = save;
  document.getElementById('search-input').oninput = render;
  document.getElementById('filter-room').onchange = render;

  document.getElementById('btn-modal-cancel').onclick = () => document.getElementById('overlay').classList.remove('active');
  document.getElementById('btn-modal-confirm').onclick = executeDelete;
}

function switchTab(t) {
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + (t === 'scan' ? 'scan' : 'inventory')).classList.add('active');
  document.getElementById('nav-' + (t === 'reg-btn' ? 'reg-btn' : 'inv-btn')).classList.add('active'); // Correção de ID
  document.getElementById('nav-reg-btn').classList.toggle('active', t === 'scan');
  document.getElementById('nav-inv-btn').classList.toggle('active', t === 'inventory');
  if(t === 'inventory') render();
}

function toggleNewModel(on) {
  document.getElementById('block-select-model').style.display = on ? 'none' : 'block';
  document.getElementById('block-new-model').style.display = on ? 'block' : 'none';
  updateUIFields();
}

function updateUIFields() {
  const modelId = document.getElementById('f-modelo').value;
  document.getElementById('btn-delete-model-trigger').style.display = modelId ? 'block' : 'none';
  
  let cat = "";
  if (document.getElementById('block-new-model').style.display === 'block') {
    cat = document.getElementById('f-new-type').value.toLowerCase();
  } else {
    const m = DB.modelos.find(x => String(x.id) === String(modelId));
    cat = m ? String(m.tipo).toLowerCase() : "";
  }
  
  const isNet = cat.includes('access') || cat.includes('impressora') || cat.includes('computador') || cat.includes('notebook') || cat.includes('servidor');
  document.getElementById('group-ip').style.display = isNet ? 'block' : 'none';
}

async function loadData() {
  const grid = document.getElementById('asset-grid');
  grid.innerHTML = '<div class="loader">A sincronizar com a nuvem...</div>';
  try {
    const res = await fetch(API_URL + "?action=getAll");
    const data = await res.json();
    DB.modelos = data.modelos || [];
    DB.ativos = data.ativos || [];
    updateSelectors();
    render();
  } catch (e) {
    grid.innerHTML = `<div class="loader" style="color:var(--danger)">⚠️ Erro de Ligação. Verifique se a Implantação do Google está como 'Qualquer pessoa'.</div>`;
  }
}

function updateSelectors() {
  const sel = document.getElementById('f-modelo');
  const cur = sel.value;
  sel.options.length = 0; sel.add(new Option("Selecione o modelo...", ""));
  DB.modelos.forEach(m => sel.add(new Option(m.nome, m.id)));
  sel.value = cur;

  const rSel = document.getElementById('filter-room');
  const old = rSel.value;
  rSel.options.length = 0; rSel.add(new Option("Todas as Salas", "ALL"));
  [...new Set(DB.ativos.map(a => String(a.setor || "")))].filter(s => s && s !== "undefined").sort().forEach(r => rSel.add(new Option(r, r)));
  rSel.value = old || "ALL";

  const chips = document.getElementById('cat-chips');
  chips.innerHTML = `<button class="chip ${DB.cat === 'TODOS' ? 'active' : ''}" onclick="setCategory('TODOS')">Todos</button>`;
  [...new Set(DB.modelos.map(m => String(m.tipo || "")))].filter(t => t && t !== "undefined").sort().forEach(c => {
    chips.innerHTML += `<button class="chip ${DB.cat === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`;
  });
}

window.setCategory = (c) => { DB.cat = c; updateSelectors(); render(); };

async function save() {
  const btn = document.getElementById('btn-save-equipment');
  const isNew = document.getElementById('block-new-model').style.display === 'block';
  const mid = isNew ? document.getElementById('f-new-name').value.toLowerCase().replace(/\s+/g,'_') : document.getElementById('f-modelo').value;
  
  if(!mid || !document.getElementById('f-serial').value) return alert("Erro: Série e Modelo são obrigatórios!");

  const payload = {
    serial: document.getElementById('f-serial').value,
    qtd: document.getElementById('f-qtd').value,
    modeloid: mid,
    isNovoModelo: isNew,
    nomeModelo: document.getElementById('f-new-name').value,
    tipo: document.getElementById('f-new-type').value,
    icon: document.getElementById('f-icon').value,
    ip: document.getElementById('f-ip').value,
    hostname: document.getElementById('f-hostname').value,
    setor: document.getElementById('f-setor').value
  };

  btn.innerText = "A GUARDAR..."; btn.disabled = true;
  try {
    // Usamos no-cors para evitar problemas de pré-verificação do navegador
    await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    alert("Equipamento registado!");
    resetForm();
    await loadData();
    switchTab('inventory');
  } catch (e) {
    alert("Erro de rede.");
  } finally {
    btn.innerText = "GUARDAR EQUIPAMENTO"; btn.disabled = false;
  }
}

function resetForm() {
  ['f-serial', 'f-hostname', 'f-setor', 'f-ip', 'f-new-name'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-qtd').value = "1";
  toggleNewModel(false);
}

function formatImg(url) {
  if(!url || typeof url !== 'string' || !url.startsWith('http')) return url || "📦";
  if(url.includes('drive.google.com')){
    const id = url.match(/\/d\/([^/]+)/) || url.match(/id=([^&]+)/);
    if(id) return `https://drive.google.com/uc?export=view&id=${id[1]}`;
  }
  return url;
}

function render() {
  const grid = document.getElementById('asset-grid');
  const q = (document.getElementById('search-input').value || "").toLowerCase();
  const room = document.getElementById('filter-room').value;

  const filtered = DB.ativos.filter(a => {
    const m = DB.modelos.find(x => String(x.id) === String(a.modeloid)) || {};
    const text = (String(a.serial||"") + String(a.hostname||"") + String(m.nome||"") + String(a.ip||"")).toLowerCase();
    const matchCat = DB.cat === 'TODOS' || String(m.tipo) === DB.cat;
    const matchRoom = room === 'ALL' || String(a.setor) === room;
    return matchCat && matchRoom && text.includes(q);
  });

  if(!filtered.length) { grid.innerHTML = '<div class="loader">Nenhum equipamento encontrado.</div>'; return; }

  grid.innerHTML = filtered.reverse().map(a => {
    const m = DB.modelos.find(x => String(x.id) === String(a.modeloid)) || {};
    const img = formatImg(m.icon || m.foto);
    const visual = img.startsWith('http') ? `<img src="${img}" onerror="this.outerHTML='<span>📦</span>'">` : `<span>${img}</span>`;
    
    return `
      <div class="card">
        <button class="delete-btn" onclick="askDelete('asset','${a.id}')">✕</button>
        <div class="card-img">${visual}</div>
        <div class="card-content">
          <div class="card-title">${m.nome || 'Desconhecido'}</div>
          <div class="card-sub">${m.tipo || 'ATIVO'}</div>
          <div class="badge">${a.setor || 'Sem Sala'}</div>
          <div style="margin-bottom:10px;">
            ${a.ip ? `<span class="spec-badge" style="color:var(--accent)">🌐 ${a.ip}</span>` : ''}
          </div>
          <div class="data-grid">
            <div><div class="data-lbl">SÉRIE</div><div class="data-val">${a.serial}</div></div>
            <div><div class="data-lbl">HOST / NOME</div><div class="data-val">${a.hostname || '--'}</div></div>
          </div>
        </div>
      </div>`;
  }).join('');
}

window.askDelete = (type, id) => { 
  TO_DELETE = {type, id}; 
  document.getElementById('overlay').classList.add('active'); 
};

async function executeDelete() {
  if(!TO_DELETE) return;
  const btn = document.getElementById('btn-modal-confirm');
  btn.innerText = "A ELIMINAR...";
  try {
    await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id: TO_DELETE.id }) });
    document.getElementById('overlay').classList.remove('active');
    await loadData();
  } catch (e) { alert("Erro."); } finally { btn.innerText = "Sim, Eliminar"; }
}
</script>
</body>
</html>
