<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Inventário TI Glória 122</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; --surface: #1c1c1e; --surface2: #2c2c2e; --border: #38383a;
    --text: #f5f5f7; --muted: #8e8e93; --accent: #30d158; --danger: #ff453a;
    --font: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
    --nav-height: 70px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); padding-bottom: calc(var(--nav-height) + 20px); }
  
  header { 
    background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); 
    padding: 16px 20px; border-bottom: 1px solid var(--border); 
    display: flex; justify-content: space-between; align-items: center; 
    position: sticky; top: 0; z-index: 100; 
  }
  .logo { font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .logo span { color: var(--accent); font-weight: 600; }
  
  nav { 
    position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height); 
    background: rgba(28, 28, 30, 0.95); border-top: 1px solid var(--border); 
    display: flex; z-index: 100; 
  }
  .nav-btn { 
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    background: transparent; border: none; color: var(--muted); font-size: 12px; cursor: pointer; 
  }
  .nav-btn.active { color: var(--accent); }
  
  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  .view-section { display: none; }
  .view-section.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
  
  input, select { 
    width: 100%; padding: 14px; background: var(--surface2); 
    border: 1px solid var(--border); border-radius: 12px; 
    color: #fff; font-size: 16px; outline: none; 
  }
  
  .btn-primary { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; margin-top: 10px; cursor: pointer; }
  .btn-secondary { width: 100%; padding: 12px; background: transparent; color: var(--accent); border: 1px dashed var(--accent); border-radius: 12px; font-size: 14px; margin-top: 8px; cursor: pointer; }
  
  .chip-container { display: flex; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; gap: 8px; scrollbar-width: none; }
  .chip-container::-webkit-scrollbar { display: none; }
  .chip { background: var(--surface2); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
  .chip.active { background: rgba(48, 209, 88, 0.15); color: var(--accent); border-color: var(--accent); }
  
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; overflow: hidden; position: relative;}
  .card-img { width: 100%; height: 180px; background: #000; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
  .card-img img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .card-img span { font-size: 64px; }
  
  .card-content { padding: 16px; }
  .card-title { font-weight: 600; font-size: 18px; margin-bottom: 4px; }
  .card-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; font-family: var(--mono); }
  .badge { background: var(--surface2); padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--accent); border: 1px solid var(--border); display: inline-block; }
  
  .spec-badge { background: #1c1c1e; color: #8e8e93; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-family: var(--mono); border: 1px solid var(--border); margin: 0 4px 4px 0; display: inline-block; }
  
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--mono); font-size: 12px; background: #000; padding: 12px; border-radius: 8px; margin-top: 10px; }
  .data-lbl { color: var(--muted); font-size: 9px; margin-bottom: 2px; text-transform: uppercase; }
  
  .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,69,58,0.2); color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 5; }
  
  .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .overlay.active { display: flex; }
  .modal { background: var(--surface); width: 90%; max-width: 350px; border-radius: 20px; padding: 24px; text-align: center; }
  .loader { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">// TI <span>GLÓRIA 122</span></div>
  <button id="sync-btn" style="background:none; border:none; color:var(--accent); font-size:22px; cursor:pointer;">↻</button>
</header>

<main>
  <!-- ABA REGISTO -->
  <div id="view-scan" class="view-section active">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px;">
      <div><label>Série / Património</label><input type="text" id="f-serial" placeholder="Digite o serial"></div>
      <div><label>Qtd.</label><input type="number" id="f-qtd" value="1" min="1"></div>
    </div>

    <div id="model-select-block">
      <label>Modelo do Equipamento</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="f-modelo" style="flex: 1;"><option value="">A carregar modelos...</option></select>
        <button id="del-mod-btn" style="display:none; background:none; border:none; font-size:18px;">🗑️</button>
      </div>
      <button class="btn-secondary" id="show-new-mod-btn">+ Adicionar Novo Modelo</button>
    </div>

    <!-- CRIAR NOVO MODELO -->
    <div id="new-model-block" style="display:none; background: rgba(48,209,88,0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(48,209,88,0.2);">
      <div class="input-group"><label>Nome do Modelo</label><input type="text" id="f-new-name" placeholder="Ex: Dell Precision 3560"></div>
      <div class="input-group">
        <label>Categoria</label>
        <select id="f-new-type">
          <option value="Computador">Computador</option>
          <option value="Notebook">Notebook / Portátil</option>
          <option value="Monitor">Monitor</option>
          <option value="Access Point">Access Point</option>
          <option value="Impressora">Impressora</option>
          <option value="Toner">Toner</option>
          <option value="Receptor de Microfone">Receptor de Mic</option>
          <option value="Outro">Outro...</option>
        </select>
      </div>

      <!-- Detalhes Dinâmicos -->
      <div id="specs-block" style="display:none;" class="input-group">
        <label>Specs (CPU | RAM | SSD)</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
          <input type="text" id="f-cpu" placeholder="Ex: i5">
          <input type="text" id="f-ram" placeholder="16GB">
          <input type="text" id="f-storage" placeholder="512GB">
        </div>
      </div>

      <div id="toner-block" style="display:none;" class="input-group">
         <label>Cor e Impressora Alvo</label>
         <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
           <select id="f-t-color"><option value="Preto">Preto</option><option value="Ciano">Ciano</option><option value="Magenta">Magenta</option><option value="Amarelo">Amarelo</option></select>
           <input type="text" id="f-t-printer" placeholder="Ex: HP M428">
         </div>
      </div>

      <div id="mic-block" style="display:none;" class="input-group">
         <label>Canais/Microfones</label>
         <input type="number" id="f-mic-count" placeholder="Ex: 2">
      </div>

      <div class="input-group">
        <label>Foto (Link ou Emoji)</label>
        <input type="text" id="f-icon" value="📦">
      </div>
      <button class="btn-secondary" id="cancel-new-mod-btn">Cancelar</button>
    </div>

    <!-- DADOS DO ATIVO -->
    <div style="margin-top:20px;">
      <div id="ip-block" style="display:none;" class="input-group">
        <label style="color: var(--accent);">Endereço IP</label>
        <input type="text" id="f-ip" placeholder="192.168.1.100">
      </div>
      <div class="input-group"><label>Hostname / Nome Rede</label><input type="text" id="f-hostname" placeholder="Ex: PC-SALA-01"></div>
      <div class="input-group"><label>Sala / Setor</label><input type="text" id="f-setor" placeholder="Ex: Sala 202"></div>
    </div>
    
    <button class="btn-primary" id="save-btn">GUARDAR EQUIPAMENTO</button>
  </div>

  <!-- ABA INVENTÁRIO -->
  <div id="view-inventory" class="view-section">
    <div class="chip-container" id="cat-chips"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="search" placeholder="Procurar...">
      <select id="filter-room"><option value="ALL">Todas as Salas</option></select>
    </div>
    <div id="list-container"></div>
  </div>
</main>

<nav>
  <button class="nav-btn active" id="nav-scan">📷<span>Registar</span></button>
  <button class="nav-btn" id="nav-list">📋<span>Inventário</span></button>
</nav>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Confirmar</h3><p id="m-text" style="margin:15px 0; color:var(--muted); font-size:14px;">Tem a certeza que deseja eliminar?</p>
    <div style="display:flex; gap:10px;">
      <button class="btn-primary" style="background:var(--surface2); color:#fff;" id="m-cancel">Não</button>
      <button class="btn-primary" id="m-confirm" style="background:var(--danger);">Sim, Eliminar</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwATRzq1Jk-8txTT4CQ8uXLbJhQxu_Ln2IrX--AP_ajL5BxRBWQV7nIMzoz37SvVBZv/exec";

  let DB = { modelos: [], ativos: [], cat: 'TODOS' };
  let TO_DELETE = null;

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('nav-scan').onclick = () => showView('scan');
    document.getElementById('nav-list').onclick = () => showView('inventory');
    document.getElementById('sync-btn').onclick = load;
    document.getElementById('show-new-mod-btn').onclick = () => toggleNewMod(true);
    document.getElementById('cancel-new-mod-btn').onclick = () => toggleNewMod(false);
    
    // Atualizar campos ao mudar tipo ou modelo
    document.getElementById('f-new-type').onchange = updateUI;
    document.getElementById('f-modelo').onchange = updateUI;
    
    document.getElementById('save-btn').onclick = save;
    document.getElementById('search').oninput = render;
    document.getElementById('filter-room').onchange = render;
    document.getElementById('m-cancel').onclick = () => document.getElementById('overlay').classList.remove('active');
    document.getElementById('m-confirm').onclick = executeDelete;

    load();
  });

  function showView(v) {
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + (v === 'scan' ? 'scan' : 'inventory')).classList.add('active');
    document.getElementById('nav-' + (v === 'scan' ? 'scan' : 'list')).classList.add('active');
    if(v === 'inventory') render();
  }

  function toggleNewMod(on) {
    document.getElementById('model-select-block').style.display = on ? 'none' : 'block';
    document.getElementById('new-model-block').style.display = on ? 'block' : 'none';
    updateUI();
  }

  function updateUI() {
    const isNew = document.getElementById('new-model-block').style.display === 'block';
    let cat = "";
    
    if(isNew) {
      cat = document.getElementById('f-new-type').value.toLowerCase();
    } else {
      const mid = document.getElementById('f-modelo').value;
      const m = DB.modelos.find(x => String(x.id).trim() === String(mid).trim());
      cat = m ? String(m.tipo).toLowerCase() : "";
      document.getElementById('del-mod-btn').style.display = mid ? 'block' : 'none';
    }

    // Mostrar blocos específicos
    document.getElementById('specs-block').style.display = (cat.includes('computador') || cat.includes('notebook')) ? 'block' : 'none';
    document.getElementById('toner-block').style.display = cat.includes('toner') ? 'block' : 'none';
    document.getElementById('mic-block').style.display = cat.includes('receptor') ? 'block' : 'none';
    
    // Mostrar campo IP para ativos de rede
    const isNet = cat.includes('access') || cat.includes('impressora') || cat.includes('computador') || cat.includes('notebook') || cat.includes('servidor') || cat.includes('switch') || cat.includes('router');
    document.getElementById('ip-block').style.display = isNet ? 'block' : 'none';
  }

  async function load() {
    const list = document.getElementById('list-container');
    list.innerHTML = '<div class="loader">A atualizar inventário...</div>';
    try {
      const res = await fetch(API_URL + "?action=getAll");
      const data = await res.json();
      DB.modelos = data.modelos || [];
      DB.ativos = data.ativos || [];
      updateSelectors();
      render();
    } catch (e) {
      list.innerHTML = '<div class="loader" style="color:var(--danger)">Erro de ligação.</div>';
    }
  }

  function updateSelectors() {
    const sel = document.getElementById('f-modelo');
    const old = sel.value;
    sel.options.length = 0; sel.add(new Option("Selecione o modelo...", ""));
    DB.modelos.forEach(m => sel.add(new Option(m.nome, m.id)));
    sel.value = old;

    const rSel = document.getElementById('filter-room');
    const oldRoom = rSel.value;
    rSel.options.length = 0; rSel.add(new Option("Todas as Salas", "ALL"));
    [...new Set(DB.ativos.map(a => String(a.setor || "")))].filter(s => s && s !== "undefined").sort().forEach(r => rSel.add(new Option(r, r)));
    rSel.value = oldRoom || "ALL";

    const chips = document.getElementById('cat-chips');
    chips.innerHTML = `<button class="chip ${DB.cat === 'TODOS' ? 'active' : ''}" onclick="setCategory('TODOS')">Todos</button>`;
    const cats = [...new Set(DB.modelos.map(m => String(m.tipo || "")))].filter(t => t && t !== "undefined").sort();
    cats.forEach(c => {
      chips.innerHTML += `<button class="chip ${DB.cat === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`;
    });
  }

  window.setCategory = (c) => { DB.cat = c; updateSelectors(); render(); };

  async function save() {
    const btn = document.getElementById('save-btn');
    const isNew = document.getElementById('new-model-block').style.display === 'block';
    
    // Gerar ID Automático (slug)
    const nameInput = document.getElementById('f-new-name').value;
    const mid = isNew 
      ? nameInput.toLowerCase().trim().replace(/\s+/g,'_').normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
      : document.getElementById('f-modelo').value;
    
    if(!mid || !document.getElementById('f-serial').value) return alert("Erro: Série e Modelo são obrigatórios!");

    const payload = {
      serial: document.getElementById('f-serial').value,
      qtd: document.getElementById('f-qtd').value,
      modeloid: mid,
      isNovoModelo: isNew,
      nomeModelo: nameInput,
      tipo: document.getElementById('f-new-type').value,
      cpu: document.getElementById('f-cpu').value,
      ram: document.getElementById('f-ram').value,
      storage: document.getElementById('f-storage').value,
      tonercolor: document.getElementById('f-t-color').value,
      tonerprinter: document.getElementById('f-t-printer').value,
      miccount: document.getElementById('f-mic-count').value,
      icon: document.getElementById('f-icon').value,
      ip: document.getElementById('f-ip').value,
      hostname: document.getElementById('f-hostname').value,
      setor: document.getElementById('f-setor').value
    };

    btn.innerText = "A GUARDAR..."; btn.disabled = true;
    try {
      await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
      alert("Equipamento registado!");
      resetForm();
      setTimeout(load, 1500);
      showView('inventory');
    } catch (e) { alert("Erro de rede."); } finally { btn.innerText = "GUARDAR EQUIPAMENTO"; btn.disabled = false; }
  }

  function resetForm() {
    ['f-serial', 'f-hostname', 'f-setor', 'f-ip', 'f-new-name', 'f-cpu', 'f-ram', 'f-storage', 'f-t-printer', 'f-mic-count'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    document.getElementById('f-qtd').value = "1";
    toggleNewMod(false);
  }

  function formatImg(url) {
    if(!url || typeof url !== 'string') return "📦";
    const cleanUrl = url.trim();
    if(!cleanUrl.startsWith('http')) return cleanUrl;
    if(cleanUrl.includes('drive.google.com')){
      const id = cleanUrl.match(/\/d\/([^/]+)/) || cleanUrl.match(/id=([^&]+)/);
      if(id) return `https://drive.google.com/uc?export=view&id=${id[1]}`;
    }
    return cleanUrl;
  }

  function render() {
    const grid = document.getElementById('list-container');
    const q = (document.getElementById('search').value || "").toLowerCase();
    const r = document.getElementById('filter-room').value;

    const filtered = DB.ativos.filter(a => {
      // Busca segura do modelo
      const modelID = String(a.modeloid || "").trim().toLowerCase();
      const m = DB.modelos.find(x => String(x.id).trim().toLowerCase() === modelID) || {};
      
      const text = (String(a.serial||"") + String(a.hostname||"") + String(m.nome||"") + String(a.ip||"")).toLowerCase();
      const matchCat = DB.cat === 'TODOS' || String(m.tipo).toUpperCase() === DB.cat.toUpperCase();
      const matchRoom = r === 'ALL' || String(a.setor) === r;
      return matchCat && matchRoom && text.includes(q);
    });

    if(!filtered.length) { grid.innerHTML = '<div class="loader">Nenhum equipamento encontrado.</div>'; return; }

    grid.innerHTML = filtered.reverse().map(a => {
      const modelID = String(a.modeloid || "").trim().toLowerCase();
      const m = DB.modelos.find(x => String(x.id).trim().toLowerCase() === modelID) || {};
      
      const imgUrl = formatImg(m.icon || m.foto);
      const isUrl = imgUrl.startsWith('http');
      const visual = isUrl 
        ? `<img src="${imgUrl}" referrerpolicy="no-referrer" alt="Foto" onerror="this.onerror=null; this.parentElement.innerHTML='<span>⚠️</span>';">` 
        : `<span>${imgUrl || '📦'}</span>`;
      
      let specs = [];
      if(m.cpu) specs.push(`⚙️ ${m.cpu}`);
      if(m.ram) specs.push(`🧠 ${m.ram}`);
      if(m.storage) specs.push(`💾 ${m.storage}`);
      if(m.miccount) specs.push(`🎤 ${m.miccount} Mics`);
      if(m.tonercolor) specs.push(`💧 ${m.tonercolor}`);
      if(m.tonerprinter) specs.push(`🖨️ ${m.tonerprinter}`);
      if(a.ip) specs.push(`🌐 ${a.ip}`);

      return `
        <div class="card">
          <button class="delete-btn" onclick="askDelete('asset','${a.id}')">✕</button>
          <div class="card-img">${visual}</div>
          <div class="card-content">
            <div class="card-title">${m.nome || 'Modelo Desconhecido'}</div>
            <div class="card-sub">${m.tipo || 'ATIVO'}</div>
            <div class="badge">${a.setor || 'Sem Sala'}</div>
            <div style="margin-top:8px; display: flex; flex-wrap: wrap;">${specs.map(s => `<span class="spec-badge">${s}</span>`).join('')}</div>
            <div class="data-grid">
              <div><div class="data-lbl">SÉRIE</div><div>${a.serial}</div></div>
              <div><div class="data-lbl">HOST / NOME</div><div>${a.hostname || '--'}</div></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  window.askDelete = (type, id) => { 
    TO_DELETE = {type, id}; 
    document.getElementById('overlay').classList.add('active'); 
  };

  async function executeDelete() {
    if(!TO_DELETE) return;
    const btn = document.getElementById('m-confirm');
    btn.innerText = "...";
    try {
      await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id: TO_DELETE.id }) });
      document.getElementById('overlay').classList.remove('active');
      setTimeout(load, 1500);
    } catch (e) { alert("Erro ao eliminar."); } finally { btn.innerText = "Sim, Eliminar"; }
  }
</script>
</body>
</html>
