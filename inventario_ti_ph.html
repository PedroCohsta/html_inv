<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Inventário TI Glória 122</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; 
    --surface: #1c1c1e; /* Estilo mais nativo iOS/Android dark */
    --surface2: #2c2c2e; 
    --border: #38383a;
    --text: #f5f5f7; 
    --muted: #8e8e93; 
    --accent: #30d158; /* Verde mais vibrante para mobile */
    --danger: #ff453a;
    --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --nav-height: 70px;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg); color: var(--text); font-family: var(--font); 
    line-height: 1.5; min-height: 100vh; padding-bottom: calc(var(--nav-height) + 20px);
  }

  /* --- CABEÇALHO --- */
  header {
    background: rgba(28, 28, 30, 0.9);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    padding-top: max(16px, env(safe-area-inset-top));
  }
  .logo { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--muted); }
  .logo span { color: var(--accent); font-weight: 600; }
  .btn-sync { background: none; border: none; color: var(--accent); font-size: 20px; padding: 4px; cursor: pointer; }

  /* --- NAVEGAÇÃO DE FUNDO (BOTTOM NAV) --- */
  nav {
    position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
    background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--muted); font-family: var(--font);
    font-size: 12px; font-weight: 500; padding: 8px; cursor: pointer; transition: 0.2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 22px; margin-bottom: 4px; }

  /* --- ÁREA DE CONTEÚDO --- */
  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  .view-section { display: none; animation: fadeIn 0.3s ease; }
  .view-section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* --- FORMULÁRIOS MOBILES --- */
  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
  
  input, select {
    width: 100%; padding: 14px 16px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px;
    color: #fff; font-size: 16px; /* 16px previne zoom automático no iOS */
    outline: none; font-family: var(--font); appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  
  /* Seta do Select Native */
  .select-wrapper { position: relative; }
  .select-wrapper::after {
    content: "▼"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 12px; pointer-events: none;
  }

  /* Botões de Ação */
  .btn-primary {
    width: 100%; padding: 16px; background: var(--accent); color: #000;
    border: none; border-radius: 12px; font-weight: 600; font-size: 16px;
    margin-top: 10px; cursor: pointer; transition: 0.2s;
  }
  .btn-primary:active { opacity: 0.7; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    width: 100%; padding: 12px; background: transparent; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 12px; font-weight: 500; font-size: 14px;
    margin-top: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* Caixa de Novo Modelo */
  .new-model-box { background: rgba(48, 209, 88, 0.05); border: 1px solid rgba(48, 209, 88, 0.3); padding: 16px; border-radius: 12px; margin-top: 12px; }
  .specs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* --- INVENTÁRIO (CARDS) --- */
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface2); color: var(--text); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border);
  }
  .chip.active { background: rgba(48, 209, 88, 0.15); color: var(--accent); border-color: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-bottom: 16px; position: relative;
  }
  .card-img {
    width: 100%; height: 120px; background: var(--surface2); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
  }
  .card-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .card-img span { font-size: 48px; }

  .card-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; padding-right: 40px; }
  .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; background: var(--surface2); color: var(--text); font-size: 11px; font-weight: 600; }
  
  .spec-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .spec-badge { background: #000; color: #ccc; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-family: var(--mono); border: 1px solid var(--border); }

  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--mono); font-size: 12px; background: #000; padding: 10px; border-radius: 8px; }
  .data-col { display: flex; flex-direction: column; }
  .data-lbl { color: var(--muted); font-size: 10px; }
  .data-val { color: var(--accent); }

  .delete-btn {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255, 69, 58, 0.1); color: var(--danger); border: none;
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* --- MODAL --- */
  .overlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.8); z-index: 200; display: none;
    align-items: center; justify-content: center; backdrop-filter: blur(5px);
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--surface); width: 90%; max-width: 350px;
    border-radius: 20px; padding: 24px; text-align: center; border: 1px solid var(--border);
  }
  .modal h3 { margin-bottom: 8px; font-size: 18px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .modal-btns { display: flex; gap: 12px; }
  .modal-btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; border: none; }
  .btn-cancel { background: var(--surface2); color: var(--text); }
  .btn-confirm { background: var(--danger); color: #fff; }

  .loader { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">// INVENTÁRIO <span>TI GLÓRIA 122</span></div>
  <button type="button" class="btn-sync" id="btn-sync" title="Sincronizar">↻</button>
</header>

<main>
  <!-- ABA DE REGISTO (Formulário) -->
  <div id="view-scan" class="view-section active">
    <div class="input-group">
      <label>Património / Série</label>
      <input type="text" id="f-serial" placeholder="Série ou Património">
    </div>

    <!-- Seletor de Modelo Seguro para Mobile -->
    <div class="input-group" id="block-select-model">
      <label>Equipamento</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <div class="select-wrapper" style="flex: 1;">
          <select id="f-modelo">
            <option value="">A carregar modelos...</option>
          </select>
        </div>
        <button type="button" id="btn-delete-model" class="delete-model-btn" style="display:none;">🗑️</button>
      </div>
      <button type="button" id="btn-toggle-new" class="btn-secondary">
        + Adicionar Novo Modelo
      </button>
    </div>

    <!-- Caixa de Criação de Modelo (Aparece ao clicar no botão acima) -->
    <div id="block-new-model" class="new-model-box" style="display:none;">
      <h4 style="margin-bottom: 12px; color: var(--accent); font-size: 14px;">Criar Novo Modelo</h4>
      
      <div class="input-group">
        <label>Nome do Modelo</label>
        <input type="text" id="f-new-name" placeholder="Ex: Optiplex 3070">
      </div>
      
      <div class="input-group">
        <label>Categoria</label>
        <div class="select-wrapper">
          <select id="f-new-type-select">
            <option value="">Selecione...</option>
            <option value="Computador">Computador</option>
            <option value="Notebook">Portátil / Notebook</option>
            <option value="Monitor">Monitor</option>
            <option value="Impressora">Impressora</option>
            <option value="Amplificador">Amplificador</option>
            <option value="UPS">UPS / Nobreak</option>
            <option value="Outro">Outro...</option>
          </select>
        </div>
      </div>
      
      <div class="input-group" id="group-custom-type" style="display:none;">
        <label>Qual?</label>
        <input type="text" id="f-new-type-custom" placeholder="Ex: Projetor">
      </div>
      
      <div id="group-specs" style="display:none;">
        <label>Especificações</label>
        <div class="specs-grid">
          <input type="text" id="f-new-cpu" placeholder="CPU">
          <input type="text" id="f-new-ram" placeholder="RAM">
          <input type="text" id="f-new-storage" placeholder="Disco">
        </div>
        <br>
      </div>

      <div class="input-group" style="margin-bottom: 0;">
        <label>Ícone/Emoji</label>
        <input type="text" id="f-new-icon" value="💻">
      </div>

      <button type="button" id="btn-cancel-new" class="btn-secondary" style="margin-top: 16px; border-color: var(--muted); color: var(--muted);">
        Cancelar Criação
      </button>
    </div>

    <div class="input-group" style="margin-top: 16px;">
      <label>Hostname</label>
      <input type="text" id="f-hostname" placeholder="Ex: PC-SALA-01">
    </div>

    <div class="input-group">
      <label>Sala / Setor</label>
      <input type="text" id="f-setor" placeholder="Ex: Receção">
    </div>

    <button type="button" class="btn-primary" id="btn-save">GUARDAR EQUIPAMENTO</button>
  </div>

  <!-- ABA DE INVENTÁRIO (Lista) -->
  <div id="view-inventory" class="view-section">
    <div class="filter-scroll" id="category-chips">
      <!-- Chips gerados via JS -->
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
      <input type="text" id="search-input" placeholder="Pesquisar...">
      <div class="select-wrapper">
        <select id="filter-room">
          <option value="ALL">Todas as Salas</option>
        </select>
      </div>
    </div>
    
    <div id="asset-grid">
      <div class="loader">A sincronizar dados...</div>
    </div>
  </div>
</main>

<!-- BOTTOM NAVIGATION -->
<nav>
  <button type="button" class="nav-btn active" id="nav-scan">
    <span class="nav-icon">📷</span>
    <span>Registar</span>
  </button>
  <button type="button" class="nav-btn" id="nav-inventory">
    <span class="nav-icon">📋</span>
    <span>Inventário</span>
  </button>
</nav>

<!-- OVERLAY DE CONFIRMAÇÃO -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Confirmar</h3>
    <p id="modal-desc">Tens a certeza de que desejas efetuar esta ação?</p>
    <div class="modal-btns">
      <button type="button" class="modal-btn btn-cancel" id="btn-modal-cancel">Cancelar</button>
      <button type="button" class="modal-btn btn-confirm" id="btn-modal-confirm">Eliminar</button>
    </div>
  </div>
</div>

<script>
// ==================================================
// LÓGICA DE PROGRAMAÇÃO JAVASCRIPT (MOBILE-FIRST)
// ==================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwcxhSyEvWsnS9NegVbXxBXsAyPBn8drF3alTsdHnq2mmATFWLWFBrdANc7gxGGoDV/exec";

// Estado Global
let STATE = {
  modelos: [], ativos: [],
  categoriaAtual: 'TODOS',
  modoNovoModelo: false,
  itemParaApagar: null,
  tipoApagar: 'asset' // 'asset' ou 'model'
};

// Aguarda o telemóvel carregar a página completamente
document.addEventListener('DOMContentLoaded', () => {
  initApp();
});

function initApp() {
  // 1. Ligar Navegação Bottom
  document.getElementById('nav-scan').onclick = () => switchView('scan');
  document.getElementById('nav-inventory').onclick = () => switchView('inventory');
  document.getElementById('btn-sync').onclick = loadData;

  // 2. Ligar Botões do Formulário de Modelo
  document.getElementById('btn-toggle-new').onclick = () => toggleNewModel(true);
  document.getElementById('btn-cancel-new').onclick = () => toggleNewModel(false);
  document.getElementById('btn-delete-model').onclick = promptDeleteModel;
  
  // 3. Ligar Lógica Dinâmica (Campos)
  document.getElementById('f-modelo').onchange = checkTrashButton;
  document.getElementById('f-new-type-select').onchange = handleCategoryChange;
  document.getElementById('f-new-type-custom').oninput = handleCategoryChange;
  
  // 4. Salvar e Filtros
  document.getElementById('btn-save').onclick = saveEquipment;
  document.getElementById('search-input').oninput = renderList;
  document.getElementById('filter-room').onchange = renderList;

  // 5. Modal
  document.getElementById('btn-modal-cancel').onclick = closeModal;
  document.getElementById('btn-modal-confirm').onclick = executeDelete;

  // Arrancar!
  loadData();
}

// --------------------------------------------------
// GESTÃO DE INTERFACE (UI)
// --------------------------------------------------
function switchView(view) {
  document.getElementById('view-scan').classList.toggle('active', view === 'scan');
  document.getElementById('view-inventory').classList.toggle('active', view === 'inventory');
  
  document.getElementById('nav-scan').classList.toggle('active', view === 'scan');
  document.getElementById('nav-inventory').classList.toggle('active', view === 'inventory');

  if (view === 'inventory') renderList();
}

function toggleNewModel(forceOpen) {
  STATE.modoNovoModelo = forceOpen;
  document.getElementById('block-select-model').style.display = forceOpen ? 'none' : 'block';
  document.getElementById('block-new-model').style.display = forceOpen ? 'block' : 'none';
  
  if (!forceOpen) {
    // Limpa campos se cancelar
    document.getElementById('f-new-name').value = '';
    document.getElementById('f-new-type-select').value = '';
    handleCategoryChange(); // Esconde specs e custom type
  }
}

function checkTrashButton() {
  const modelId = document.getElementById('f-modelo').value;
  document.getElementById('btn-delete-model').style.display = (modelId && modelId !== "") ? 'flex' : 'none';
}

function handleCategoryChange() {
  const select = document.getElementById('f-new-type-select').value;
  const isCustom = select === 'Outro';
  
  document.getElementById('group-custom-type').style.display = isCustom ? 'block' : 'none';
  
  const finalCat = isCustom ? document.getElementById('f-new-type-custom').value.toLowerCase() : select.toLowerCase();
  const showSpecs = finalCat.includes('computador') || finalCat.includes('portátil') || finalCat.includes('notebook') || finalCat.includes('pc') || finalCat.includes('servidor');
  
  document.getElementById('group-specs').style.display = showSpecs ? 'block' : 'none';
}

function getFinalCategory() {
  const select = document.getElementById('f-new-type-select').value;
  if (select === 'Outro') return document.getElementById('f-new-type-custom').value.trim();
  return select;
}

// --------------------------------------------------
// LIGAÇÃO À BASE DE DADOS (API)
// --------------------------------------------------
async function loadData() {
  const grid = document.getElementById('asset-grid');
  grid.innerHTML = '<div class="loader">A sincronizar com a base de dados...</div>';
  
  try {
    const res = await fetch(SCRIPT_URL + "?action=getAll");
    const data = await res.json();
    STATE.modelos = data.modelos || [];
    STATE.ativos = data.ativos || [];
    
    updateSelectors();
    renderList();
  } catch (err) {
    grid.innerHTML = '<div class="loader" style="color:var(--danger)">Erro de ligação. Verifique a internet.</div>';
  }
}

function updateSelectors() {
  // 1. Preencher Select de Modelos (Modo Mobile Safe)
  const selMod = document.getElementById('f-modelo');
  const currentMod = selMod.value;
  selMod.innerHTML = '<option value="">Selecione o modelo...</option>';
  STATE.modelos.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id; opt.text = m.nome;
    selMod.appendChild(opt);
  });
  selMod.value = currentMod;
  checkTrashButton();

  // 2. Preencher Salas
  const selRoom = document.getElementById('filter-room');
  const currentRoom = selRoom.value;
  selRoom.innerHTML = '<option value="ALL">Todas as Salas</option>';
  const rooms = [...new Set(STATE.ativos.map(a => a.setor).filter(Boolean))].sort();
  rooms.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.text = r;
    selRoom.appendChild(opt);
  });
  selRoom.value = currentRoom || "ALL";

  // 3. Preencher Chips de Categoria
  const chipsDiv = document.getElementById('category-chips');
  chipsDiv.innerHTML = `<button type="button" class="chip ${STATE.categoriaAtual === 'TODOS' ? 'active' : ''}" onclick="setCategory('TODOS')">Todos</button>`;
  
  const cats = [...new Set(STATE.modelos.map(m => m.tipo).filter(Boolean))].sort();
  cats.forEach(c => {
    chipsDiv.innerHTML += `<button type="button" class="chip ${STATE.categoriaAtual === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`;
  });
}

// Função global para os chips gerados por string HTML
window.setCategory = function(cat) {
  STATE.categoriaAtual = cat;
  updateSelectors(); // Atualiza a cor do botão
  renderList();
};

// --------------------------------------------------
// GUARDAR E RENDERIZAR
// --------------------------------------------------
async function saveEquipment() {
  const payload = {
    serial: document.getElementById('f-serial').value.trim(),
    hostname: document.getElementById('f-hostname').value.trim(),
    setor: document.getElementById('f-setor').value.trim(),
    isNovoModelo: STATE.modoNovoModelo,
    modeloid: STATE.modoNovoModelo ? "MOD_" + Date.now() : document.getElementById('f-modelo').value,
    nomeModelo: document.getElementById('f-new-name').value.trim(),
    tipo: getFinalCategory() || "Equipamento",
    icon: document.getElementById('f-new-icon').value.trim() || "📦",
    cpu: document.getElementById('f-new-cpu').value.trim(),
    ram: document.getElementById('f-new-ram').value.trim(),
    storage: document.getElementById('f-new-storage').value.trim()
  };

  if (!payload.serial) return alert("O Número de Série/Património é obrigatório!");
  if (!payload.modeloid || (payload.isNovoModelo && !payload.nomeModelo)) return alert("Selecione um modelo ou preencha o nome do novo modelo!");

  const btn = document.getElementById('btn-save');
  btn.innerText = "A GUARDAR..."; btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    alert("Equipamento registado com sucesso!");
    
    // Limpar form
    document.getElementById('f-serial').value = "";
    document.getElementById('f-hostname').value = "";
    if (STATE.modoNovoModelo) toggleNewModel(false);
    
    // Recarregar dados do servidor
    await loadData();
    switchView('inventory');
    
  } catch (e) {
    alert("Erro de rede. Verifique a internet.");
  } finally {
    btn.innerText = "GUARDAR EQUIPAMENTO"; btn.disabled = false;
  }
}

function renderList() {
  const grid = document.getElementById('asset-grid');
  const q = document.getElementById('search-input').value.toLowerCase();
  const room = document.getElementById('filter-room').value;

  let filtered = STATE.ativos.filter(a => {
    const m = STATE.modelos.find(mod => String(mod.id) === String(a.modeloid)) || {};
    
    const catMatch = STATE.categoriaAtual === 'TODOS' || m.tipo === STATE.categoriaAtual;
    const roomMatch = room === 'ALL' || a.setor === room;
    const textMatch = (a.serial||"").toLowerCase().includes(q) || 
                      (a.hostname||"").toLowerCase().includes(q) || 
                      (m.nome||"").toLowerCase().includes(q);
                      
    return catMatch && roomMatch && textMatch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="loader">Nenhum equipamento encontrado.</div>';
    return;
  }

  // Reverse para mostrar os mais recentes primeiro
  grid.innerHTML = filtered.reverse().map(a => {
    const m = STATE.modelos.find(mod => String(mod.id) === String(a.modeloid)) || {};
    const visual = m.foto ? `<img src="${m.foto}">` : `<span>${m.icon || '📦'}</span>`;
    
    let specs = '';
    if (m.cpu || m.ram || m.storage) {
      specs = `<div class="spec-row">
        ${m.cpu ? `<span class="spec-badge">⚙️ ${m.cpu}</span>` : ''}
        ${m.ram ? `<span class="spec-badge">🧠 ${m.ram}</span>` : ''}
        ${m.storage ? `<span class="spec-badge">💾 ${m.storage}</span>` : ''}
      </div>`;
    }

    return `
      <div class="card">
        <button type="button" class="delete-btn" onclick="promptDeleteAsset('${a.id}')">✕</button>
        <div class="card-img">${visual}</div>
        <div class="card-title">${m.nome || 'Desconhecido'}</div>
        <div class="card-sub">${m.tipo || 'Equipamento'}</div>
        <div style="margin-bottom: 12px;"><span class="badge">${a.setor || 'Sem Sala'}</span></div>
        ${specs}
        <div class="data-grid">
          <div class="data-col"><span class="data-lbl">SÉRIE/PAT.</span><span class="data-val">${a.serial}</span></div>
          <div class="data-col"><span class="data-lbl">HOSTNAME</span><span class="data-val">${a.hostname || '--'}</span></div>
        </div>
      </div>
    `;
  }).join('');
}

// --------------------------------------------------
// ELIMINAÇÃO E MODAIS
// --------------------------------------------------
window.promptDeleteAsset = function(id) {
  STATE.itemParaApagar = id;
  STATE.tipoApagar = 'asset';
  document.getElementById('modal-title').innerText = "Remover Equipamento?";
  document.getElementById('modal-desc').innerText = "Esta ação vai remover este equipamento específico do inventário.";
  document.getElementById('modal-overlay').classList.add('active');
};

function promptDeleteModel() {
  const sel = document.getElementById('f-modelo');
  if(!sel.value) return;
  
  STATE.itemParaApagar = sel.value;
  STATE.tipoApagar = 'model';
  document.getElementById('modal-title').innerText = "Remover Modelo?";
  document.getElementById('modal-desc').innerText = `Isto irá remover o modelo "${sel.options[sel.selectedIndex].text}" e TODOS os equipamentos ligados a ele!`;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  STATE.itemParaApagar = null;
}

async function executeDelete() {
  if (!STATE.itemParaApagar) return;
  const btn = document.getElementById('btn-modal-confirm');
  btn.innerText = "A aguardar..."; btn.disabled = true;

  try {
    const actionToSend = STATE.tipoApagar === 'model' ? 'delete_model' : 'delete';
    await fetch(SCRIPT_URL, { 
      method: 'POST', mode: 'no-cors', 
      body: JSON.stringify({ action: actionToSend, id: STATE.itemParaApagar }) 
    });
    
    // Atualiza localmente para rapidez
    if(STATE.tipoApagar === 'model') {
      STATE.modelos = STATE.modelos.filter(m => String(m.id) !== String(STATE.itemParaApagar));
      STATE.ativos = STATE.ativos.filter(a => String(a.modeloid) !== String(STATE.itemParaApagar));
    } else {
      STATE.ativos = STATE.ativos.filter(a => String(a.id) !== String(STATE.itemParaApagar));
    }
    
    updateSelectors();
    renderList();
    closeModal();
  } catch (e) {
    alert("Erro ao eliminar. Verifique a internet.");
  } finally {
    btn.innerText = "Eliminar"; btn.disabled = false;
  }
}
</script>
